<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>VRC Photo Edit</title>
    <script type="module" crossorigin src="/VRCImageEdit/assets/index-D6Y1-zI3.js"></script>
    <link rel="stylesheet" crossorigin href="/VRCImageEdit/assets/index-DCdU85NB.css">
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="header">
          <div>
            <h1>VRC Photo Edit</h1>
            <p>画像を読み込み、反転・回転・X風トリミングをしてPNGで保存できます。</p>
          </div>
          <label class="filePicker">
            <input id="file" type="file" accept="image/*" />
            <span>画像を選択</span>
          </label>
        </header>

        <div class="layout">
          <aside class="controls" aria-label="編集ツール">
            <div class="toolGroup">
              <h2>変形</h2>
              <div class="buttonGrid">
                <button id="flipX" type="button">左右反転</button>
                <button id="flipY" type="button">上下反転</button>
                <button id="rotL" type="button">左へ90度</button>
                <button id="rotR" type="button">右へ90度</button>
              </div>
            </div>

            <div class="toolGroup">
              <h2>トリミング</h2>
              <button id="cropMode" type="button" class="wide">トリミング</button>
              <div id="cropTools" class="cropTools" hidden>
                <div class="segmented" aria-label="比率">
                  <button type="button" data-ratio="free">自由</button>
                  <button type="button" data-ratio="1">1:1</button>
                  <button type="button" data-ratio="1.7777777778">16:9</button>
                  <button type="button" data-ratio="0.8">4:5</button>
                </div>
                <div class="buttonGrid">
                  <button id="cancelCrop" type="button">キャンセル</button>
                  <button id="applyCrop" type="button" class="primary">適用</button>
                </div>
              </div>
            </div>

            <div class="toolGroup">
              <h2>出力</h2>
              <div class="buttonGrid">
                <button id="reset" type="button">リセット</button>
                <button id="download" type="button" class="primary">PNG保存</button>
              </div>
            </div>
          </aside>

          <section class="preview" aria-label="プレビュー">
            <canvas id="c"></canvas>
            <div class="status" id="info">画像未選択</div>
          </section>
        </div>
      </section>
    </main>

  </body>
</html>
